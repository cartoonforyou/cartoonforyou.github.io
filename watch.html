    // دالة للبحث عن المسلسل/الفيلم (بالرقم أو بالاسم)
    function findShow() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // محاولة جلب id
        let showId = urlParams.get('id');
        if (showId !== null) {
            let found = cartoons.find(c => c.id === parseInt(showId));
            if (found) return found;
        }
        
        // محاولة جلب name (slug)
        let showName = urlParams.get('name');
        if (showName !== null) {
            let found = cartoons.find(c => c.nameSlug === showName.toLowerCase());
            if (found) return found;
            found = cartoons.find(c => c.name.toLowerCase() === showName.toLowerCase());
            if (found) return found;
            found = cartoons.find(c => c.nameAr.toLowerCase() === showName.toLowerCase());
            if (found) return found;
        }
        
        return null;
    }

    function getCategoryName(c) { return c === 'anime' ? 'أنمي' : 'كرتون'; }
    function getTypeIcon(t) { return t === 'movie' ? '🎬 فيلم' : '📺 مسلسل'; }

    const show = findShow();

    // تحديث SEO Tags حسب المسلسل/الفيلم
    function updateSEOTags(show) {
        if (!show) return;
        
        const siteUrl = "https://cartoonforyou.github.io/";
        const pageUrl = siteUrl + "watch.html?name=" + show.nameSlug;
        
        document.title = `${show.name} | كرتون فور يو - مشاهدة ${show.name} اونلاين بجودة عالية`;
        const titleElement = document.getElementById('pageTitle');
        if (titleElement) titleElement.innerHTML = `${show.name} | كرتون فور يو`;
        
        const metaDesc = `مشاهدة ${show.name} (${show.nameAr}) اونلاين بجودة ${show.quality} - ${show.description.substring(0, 150)}`;
        const metaDescElement = document.getElementById('metaDescription');
        if (metaDescElement) metaDescElement.setAttribute('content', metaDesc);
        
        const metaKeywords = `${show.name}, ${show.nameAr}, ${show.nameSlug}, مشاهدة ${show.name}, كرتون, انمي, كرتون فور يو, cartoon for you`;
        const metaKeywordsElement = document.getElementById('metaKeywords');
        if (metaKeywordsElement) metaKeywordsElement.setAttribute('content', metaKeywords);
        
        const ogTitleElement = document.getElementById('ogTitle');
        if (ogTitleElement) ogTitleElement.setAttribute('content', `${show.name} | كرتون فور يو`);
        const ogDescElement = document.getElementById('ogDescription');
        if (ogDescElement) ogDescElement.setAttribute('content', metaDesc);
        const ogImageElement = document.getElementById('ogImage');
        if (ogImageElement) ogImageElement.setAttribute('content', siteUrl + show.img);
        const ogUrlElement = document.getElementById('ogUrl');
        if (ogUrlElement) ogUrlElement.setAttribute('content', pageUrl);
        
        const twitterTitleElement = document.getElementById('twitterTitle');
        if (twitterTitleElement) twitterTitleElement.setAttribute('content', `${show.name} | كرتون فور يو`);
        const twitterDescElement = document.getElementById('twitterDescription');
        if (twitterDescElement) twitterDescElement.setAttribute('content', metaDesc);
        const twitterImageElement = document.getElementById('twitterImage');
        if (twitterImageElement) twitterImageElement.setAttribute('content', siteUrl + show.img);
        
        const canonicalElement = document.getElementById('canonicalLink');
        if (canonicalElement) canonicalElement.setAttribute('href', pageUrl);
        
        const structuredData = {
            "@context": "https://schema.org",
            "@type": show.type === "movie" ? "Movie" : "TVSeries",
            "name": show.name,
            "alternateName": show.nameAr,
            "description": show.description.substring(0, 300),
            "image": siteUrl + show.img,
            "url": pageUrl,
            "contentRating": "PG",
            "genre": "Animation, Family",
            "datePublished": show.year
        };
        const structuredDataElement = document.getElementById('structuredData');
        if (structuredDataElement) structuredDataElement.innerHTML = JSON.stringify(structuredData);
    }

    function renderPage() {
        if (!show) {
            window.location.href = 'index.html';
            return;
        }

        updateSEOTags(show);

        // إذا كان الفيلم قادماً (coming soon)
        if (show.comingSoon === true) {
            const html = `
                <div class="hero-card">
                    <div class="hero-image">
                        <img src="${show.img}" alt="${show.name}">
                    </div>
                    <div class="hero-info">
                        <h1 class="hero-title">${show.name}</h1>
                        <div class="hero-meta">
                            <span><i class="fas fa-tag"></i> ${getCategoryName(show.category)}</span>
                            <span><i class="fas fa-film"></i> ${getTypeIcon(show.type)}</span>
                            <span><i class="fas fa-calendar"></i> ${show.year}</span>
                            <span><i class="fas fa-star"></i> ${show.rating}</span>
                        </div>
                        <p class="hero-description">${show.description}</p>
                        <div class="hero-stats">
                            <div class="stat"><i class="fas fa-clock"></i> المدة: ${show.duration}</div>
                            <div class="stat"><i class="fas fa-hd"></i> الجودة: ${show.quality}</div>
                        </div>
                    </div>
                </div>
                <div class="ad-container"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-under-description"></div></div>
                <div class="player-section">
                    <div class="player-wrapper">
                        <div class="coming-soon-message">
                            <i class="fas fa-clock"></i>
                            <h2>🔜 قريباً</h2>
                            <p>هذا الفيلم سيتم إضافته قريباً إلى كرتون فور يو</p>
                        </div>
                    </div>
                </div>
                <div class="ad-container"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-under-player"></div></div>
                <div class="related-section">
                    <div class="related-header"><h3><i class="fas fa-fire"></i> قد يعجبك أيضاً</h3></div>
                    <div class="ad-container" style="margin-bottom: 20px;"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-in-related"></div></div>
                    <div class="related-grid" id="relatedGrid"></div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
            
            const relatedGrid = document.getElementById('relatedGrid');
            const relatedShows = cartoons.filter(c => c.id !== show.id && c.comingSoon !== true).slice(0, 6);
            relatedShows.forEach(related => {
                const card = document.createElement('div');
                card.className = 'related-card';
                card.innerHTML = `<img src="${related.img}" alt="${related.name}"><h4>${related.name}</h4>`;
                card.onclick = () => window.location.href = `watch.html?name=${related.nameSlug}`;
                relatedGrid.appendChild(card);
            });
            return;
        }

        // للعروض والأفلام العادية
        const episodes = show.episodes || {};
        const episodeNumbers = Object.keys(episodes).map(Number).sort((a,b) => a - b);
        
        const html = `
            <div class="hero-card">
                <div class="hero-image">
                    <img src="${show.img}" alt="${show.name}">
                </div>
                <div class="hero-info">
                    <h1 class="hero-title">${show.name}</h1>
                    <div class="hero-meta">
                        <span><i class="fas fa-tag"></i> ${getCategoryName(show.category)}</span>
                        <span><i class="fas fa-${show.type === 'movie' ? 'film' : 'tv'}"></i> ${getTypeIcon(show.type)}</span>
                        <span><i class="fas fa-calendar"></i> ${show.year}</span>
                        <span><i class="fas fa-star"></i> ${show.rating}</span>
                    </div>
                    <p class="hero-description">${show.description}</p>
                    <div class="hero-stats">
                        <div class="stat"><i class="fas fa-clock"></i> المدة: ${show.duration}</div>
                        <div class="stat"><i class="fas fa-hd"></i> الجودة: ${show.quality}</div>
                        <div class="stat"><i class="fas fa-list"></i> ${show.type === 'movie' ? 'فيلم كامل' : `عدد الحلقات: ${episodeNumbers.length}`}</div>
                    </div>
                </div>
            </div>
            <div class="ad-container"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-under-description"></div></div>
            <div class="player-section">
                <div class="player-wrapper" id="videoWrapper">
                    <div class="player-placeholder" id="videoPlaceholder">
                        <i class="fas fa-play-circle"></i>
                        <p>${show.type === 'movie' ? 'اضغط على التشغيل لمشاهدة الفيلم' : 'اختر حلقة من القائمة أدناه للمشاهدة'}</p>
                    </div>
                </div>
            </div>
            <div class="ad-container"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-under-player"></div></div>`;
        
        if (show.type === 'series') {
            html += `
            <div class="episodes-section">
                <div class="episodes-header">
                    <h3><i class="fas fa-list"></i> قائمة الحلقات</h3>
                    <div class="episode-count"><i class="fas fa-play"></i> ${episodeNumbers.length} حلقة</div>
                </div>
                <div class="episodes-grid" id="episodesGrid"></div>
            </div>`;
        }
        
        html += `
            <div class="ad-container"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-between-episodes"></div></div>
            <div class="related-section">
                <div class="related-header"><h3><i class="fas fa-fire"></i> قد يعجبك أيضاً</h3></div>
                <div class="ad-container" style="margin-bottom: 20px;"><div class="ad-label">• إعلان •</div><div class="ad-banner" id="ad-in-related"></div></div>
                <div class="related-grid" id="relatedGrid"></div>
            </div>
        `;
        
        document.getElementById('mainContent').innerHTML = html;
        
        if (show.type === 'series' && episodeNumbers.length > 0) {
            const episodesGrid = document.getElementById('episodesGrid');
            episodeNumbers.forEach((epNum, index) => {
                const card = document.createElement('div');
                card.className = 'episode-card';
                if (index === 0) card.classList.add('active');
                card.innerHTML = `
                    <div class="episode-number">الحلقة ${epNum}</div>
                    <div class="episode-info">
                        <h4>${show.name}</h4>
                        <p><i class="fas fa-clock"></i> ${show.duration}</p>
                    </div>
                    <div class="play-icon"><i class="fas fa-play"></i></div>
                `;
                card.onclick = () => {
                    document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    document.getElementById('videoWrapper').innerHTML = `<iframe src="${episodes[epNum]}" frameborder="0" allowfullscreen></iframe>`;
                };
                episodesGrid.appendChild(card);
            });
            if (episodes[episodeNumbers[0]]) {
                document.getElementById('videoWrapper').innerHTML = `<iframe src="${episodes[episodeNumbers[0]]}" frameborder="0" allowfullscreen></iframe>`;
            }
        } else if (show.type === 'movie' && episodes[1]) {
            document.getElementById('videoWrapper').innerHTML = `<iframe src="${episodes[1]}" frameborder="0" allowfullscreen></iframe>`;
        }
        
        const relatedGrid = document.getElementById('relatedGrid');
        const relatedShows = cartoons.filter(c => c.id !== show.id && c.comingSoon !== true).slice(0, 6);
        relatedShows.forEach(related => {
            const card = document.createElement('div');
            card.className = 'related-card';
            card.innerHTML = `<img src="${related.img}" alt="${related.name}"><h4>${related.name}</h4>`;
            card.onclick = () => window.location.href = `watch.html?name=${related.nameSlug}`;
            relatedGrid.appendChild(card);
        });
    }

    renderPage();
</script>
