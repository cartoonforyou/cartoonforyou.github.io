            height: 100%;

    ];

    // أحدث الإضافات (أول 8 عناصر جديدة)
    const sliderItems = cartoons.filter(c => c.isNew === true && !c.comingSoon).slice(0, 8);
    let currentType = "all", currentSearch = "", currentSort = "default", currentSlide = 0, autoSlideInterval;

    function getCategoryIcon(c) { return c === 'anime' ? '🇯🇵' : '🎬'; }
    function getCategoryName(c) { return c === 'anime' ? 'أنمي' : 'كرتون'; }
    function getTypeIcon(t) { return t === 'movie' ? '🎬 فيلم' : '📺 مسلسل'; }

    function updateStats() {
        document.getElementById('totalCount').innerText = cartoons.length;
        document.getElementById('animeCount').innerText = cartoons.filter(c => c.category === 'anime' || c.category === 'cartoon').length;
        document.getElementById('lastUpdate').innerText = new Date().toLocaleDateString('ar-EG');
    }

    function buildSlider() {
        if (sliderItems.length === 0) return;
        
        document.getElementById('slider').innerHTML = sliderItems.map(item => `
            <div class="slide" data-slug="${item.nameSlug}" data-coming-soon="${item.comingSoon || false}">
                <img src="${item.img}" alt="${item.name}" loading="eager">
                <div class="slide-info">
                    <span class="slide-badge"><i class="fas fa-star"></i> جديد ${item.year}</span>
                    <h2>${item.name}</h2>
                    <p>${getCategoryName(item.category)} • ${getTypeIcon(item.type)}</p>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.slide').forEach(slide => {
            const isComingSoon = slide.dataset.comingSoon === 'true';
            if (isComingSoon) {
                slide.addEventListener('click', () => alert('🔜 هذا العمل قريباً سيتم إضافته!'));
            } else {
                slide.addEventListener('click', () => window.location.href = `watch.html?name=${slide.dataset.slug}`);
            }
        });
        
        document.getElementById('sliderDots').innerHTML = sliderItems.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-dot-index="${i}"></div>`).join('');
        document.querySelectorAll('.dot').forEach(dot => dot.addEventListener('click', () => { goToSlide(parseInt(dot.dataset.dotIndex)); resetAutoSlide(); }));
    }

    function goToSlide(i) { 
        currentSlide = i; 
        document.getElementById('slider').style.transform = `translateX(-${currentSlide * 100}%)`; 
        document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === currentSlide)); 
    }
    
    function nextSlide() { goToSlide((currentSlide + 1) % sliderItems.length); }
    function prevSlide() { goToSlide((currentSlide - 1 + sliderItems.length) % sliderItems.length); }
    function startAutoSlide() { if (autoSlideInterval) clearInterval(autoSlideInterval); autoSlideInterval = setInterval(nextSlide, 5000); }
    function resetAutoSlide() { clearInterval(autoSlideInterval); startAutoSlide(); }
    
    function filterAndSort() {
        let filtered = cartoons.filter(c => currentType === "all" || c.type === currentType);
        if (currentSearch) filtered = filtered.filter(c => c.name.toLowerCase().includes(currentSearch.toLowerCase()) || c.nameAr.toLowerCase().includes(currentSearch.toLowerCase()));
        if (currentSort === "name-asc") filtered.sort((a,b) => a.name.localeCompare(b.name));
        else if (currentSort === "name-desc") filtered.sort((a,b) => b.name.localeCompare(a.name));
        
        document.getElementById('cartoonList').innerHTML = filtered.map(item => `
            <li data-slug="${item.nameSlug}" data-coming-soon="${item.comingSoon || false}">
                ${item.isNew && !item.comingSoon ? '<span class="new-badge"><i class="fas fa-star"></i> جديد</span>' : ''}
                ${item.comingSoon ? '<span class="coming-soon-badge"><i class="fas fa-clock"></i> قريباً</span>' : ''}
                <img src="${item.img}" alt="${item.name}" loading="lazy">
                <h3>${item.name}</h3>
                <div class="card-category">${getCategoryIcon(item.category)} ${getCategoryName(item.category)} • ${getTypeIcon(item.type)}</div>
            </li>
        `).join('');
        
        document.querySelectorAll('.cartoon-list li').forEach(li => {
            const isComingSoon = li.dataset.comingSoon === 'true';
            if (isComingSoon) {
                li.addEventListener('click', () => alert('🔜 هذا العمل قريباً سيتم إضافته!'));
            } else {
                li.addEventListener('click', () => window.location.href = `watch.html?name=${li.dataset.slug}`);
            }
        });
        document.getElementById('resultCount').innerText = `عرض ${filtered.length} من ${cartoons.length} عنوان`;
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => { currentSearch = e.target.value; document.getElementById('clearSearch').style.display = currentSearch ? 'flex' : 'none'; filterAndSort(); });
    document.getElementById('clearSearch').addEventListener('click', () => { document.getElementById('searchInput').value = ''; currentSearch = ''; document.getElementById('clearSearch').style.display = 'none'; filterAndSort(); });
    document.querySelectorAll('.category-btn').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentType = btn.dataset.category; filterAndSort(); }));
    document.getElementById('sortSelect').addEventListener('change', (e) => { currentSort = e.target.value; filterAndSort(); });
    document.getElementById('sliderPrev').addEventListener('click', () => { prevSlide(); resetAutoSlide(); });
    document.getElementById('sliderNext').addEventListener('click', () => { nextSlide(); resetAutoSlide(); });
    
    const sliderContainer = document.querySelector('.slider-container');
    if (sliderContainer) {
        sliderContainer.addEventListener('mouseenter', () => clearInterval(autoSlideInterval));
        sliderContainer.addEventListener('mouseleave', startAutoSlide);
    }
    
    // Dark Mode
    document.getElementById('darkModeToggle').addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const icon = document.getElementById('darkModeToggle').querySelector('i');
        if (document.body.classList.contains('light-mode')) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
        else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
        localStorage.setItem('darkMode', document.body.classList.contains('light-mode'));
    });
    if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('light-mode');
    
    // Back to Top
    window.addEventListener('scroll', () => document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300));
    document.getElementById('backToTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    
    // Page Load
    window.addEventListener('load', () => { 
        document.body.classList.add('loaded'); 
        updateStats(); 
        buildSlider(); 
        startAutoSlide(); 
        filterAndSort(); 
    });
</script>
